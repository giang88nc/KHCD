<dialog id="desk-sessions" aria-labelledby="desk-sessions-title" data-url="{{ url_for('web.desk_sessions') }}" data-today="{{ today }}">
 <header class="dialog-head"><div><small class="sessions-eyebrow">QUẦY CẦM VÀNG</small><h2 id="desk-sessions-title">Danh sách phiên giao dịch</h2></div><button type="button" class="icon-btn" data-close aria-label="Đóng danh sách phiên">×</button></header>
 <form id="sessions-filter"><label>Từ ngày<input type="date" name="d1" value="{{ today }}" required></label><label>Đến ngày<input type="date" name="d2" value="{{ today }}" required></label><label class="sessions-key">Khách hàng<input name="q" maxlength="100" placeholder="SĐT / CCCD / tên khách…" autocomplete="off"></label><button type="submit" class="btn btn-primary">Tìm phiên</button><button type="button" class="btn" id="sessions-today">Hôm nay</button></form>
 <div id="sessions-result" hidden>
  <div class="sessions-table"><table><thead><tr><th scope="col">BIÊN NHẬN</th><th scope="col">KHÁCH HÀNG</th><th scope="col">GIAO DỊCH</th><th scope="col">SỐ TIỀN</th><th scope="col">PHÁT SINH</th><th scope="col">THANH TOÁN</th><th scope="col">TỔNG TIỀN</th><th scope="col" aria-label="Mở phiếu"></th></tr></thead><tbody id="sessions-rows"></tbody></table></div>
  <div class="sessions-pagination"><button type="button" class="btn" id="sessions-prev">Trang trước</button><span id="sessions-page"></span><button type="button" class="btn" id="sessions-next">Trang sau</button></div>
 </div>
 <footer class="sessions-footer"><div id="sessions-totals" hidden></div><div id="sessions-groups" class="sessions-groups"><span id="sessions-status" role="status" aria-live="polite"></span></div></footer>
</dialog>
